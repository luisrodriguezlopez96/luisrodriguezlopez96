    <text x="156" y="261" text-anchor="middle" fill="#bae6fd">INDUSTRY</text>
    <rect x="224" y="239" width="94" height="34" rx="17" fill="#123d58" stroke="#2dd4bf" stroke-opacity=".7"/>
    <text x="271" y="261" text-anchor="middle" fill="#99f6e4">SOFTWARE</text>
    <rect x="330" y="239" width="78" height="34" rx="17" fill="#242d5a" stroke="#818cf8" stroke-opacity=".8"/>
    <text x="369" y="261" text-anchor="middle" fill="#c7d2fe">DATA &amp; AI</text>
  </g>
  <g transform="translate(850 68)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M42 36H150V84H225M150 84V144H235M42 196H112V144H150M150 84H150V36" stroke="url(#accent)" stroke-width="3" stroke-opacity=".85"/>
    <path d="M225 84H275V36M235 144H275V196" stroke="#60a5fa" stroke-width="2" stroke-opacity=".7"/>
    <circle cx="42" cy="36" r="18" fill="#0f2d47" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="150" cy="84" r="24" fill="#10384a" stroke="#2dd4bf" stroke-width="3"/>
    <circle cx="235" cy="144" r="19" fill="#242d5a" stroke="#818cf8" stroke-width="3"/>
    <circle cx="42" cy="196" r="13" fill="#0f2d47" stroke="#38bdf8" stroke-width="3"/>
