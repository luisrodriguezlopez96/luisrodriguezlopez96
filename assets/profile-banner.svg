<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Luis Rodríguez López — Industrial Automation, Software and Applied AI</title>
  <desc id="desc">Professional banner with a dark blue technology background, cyan circuit lines and connected industrial data nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1428"/>
      <stop offset=".58" stop-color="#142d50"/>
      <stop offset="1" stop-color="#102039"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset=".55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".25"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#9cc8ee" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="24" fill="url(#grid)"/>
  <circle cx="1010" cy="170" r="270" fill="url(#glow)"/>
  <path d="M0 300 C220 250 310 360 520 300 S850 230 1200 285" fill="none" stroke="#2dd4bf" stroke-opacity=".22" stroke-width="2"/>
  <path d="M0 315 C220 265 310 375 520 315 S850 245 1200 300" fill="none" stroke="#60a5fa" stroke-opacity=".2" stroke-width="1"/>
  <rect x="64" y="54" width="8" height="228" rx="4" fill="url(#accent)"/>
  <text x="100" y="92" fill="#7dd3fc" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="4">ENGINEERING · AUTOMATION · INNOVATION</text>
  <text x="96" y="164" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="52" font-weight="750" letter-spacing="-1">Luis Rodríguez López</text>
  <text x="100" y="207" fill="#cbd5e1" font-family="Segoe UI,Arial,sans-serif" font-size="22">Industrial Automation  /  Industrial Software  /  Applied AI</text>
